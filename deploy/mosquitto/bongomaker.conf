# Mosquitto 2.x — BongoMaker Control
# Copy to /etc/mosquitto/conf.d/bongomaker.conf. No passwd file: every login and
# topic check goes to bmc-backend, which reads mqtt_users in PostgreSQL.
# Needs the mosquitto-go-auth plugin: https://github.com/iegomez/mosquitto-go-auth

per_listener_settings false
allow_anonymous false

# Plain MQTT, loopback only: never reachable from outside the VPS. Use for local tools,
# or for the backend when it runs on this machine (MQTT_URL=mqtt://127.0.0.1:1883).
listener 1883 127.0.0.1

# Devices and remote clients: TLS only. Open 8883 in the firewall, keep 1883 closed.
# Let's Encrypt cert for mqtt.bongomaker.com, copied here by the certbot deploy hook
# (see README) because mosquitto can't read /etc/letsencrypt/live.
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2

auth_plugin /etc/mosquitto/go-auth.so
auth_opt_backends http
auth_opt_log_level info

# The API (must be an IP address, not a hostname).
auth_opt_http_host 127.0.0.1
auth_opt_http_port 4000
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_timeout 5
# Replace CHANGE_ME with MQTT_HOOK_SECRET from bmc-backend/.env.
auth_opt_http_getuser_uri /api/v1/mqtt/auth?secret=CHANGE_ME
auth_opt_http_superuser_uri /api/v1/mqtt/superuser?secret=CHANGE_ME
auth_opt_http_aclcheck_uri /api/v1/mqtt/acl?secret=CHANGE_ME

# Cache decisions so the API isn't called on every message. Disabling or editing a user
# takes effect within these windows (new connections immediately after expiry).
auth_opt_cache true
auth_opt_auth_cache_seconds 60
auth_opt_acl_cache_seconds 60
auth_opt_auth_jitter_seconds 5
auth_opt_acl_jitter_seconds 5
